[Launch]
ProgramExecutable=Program\IObitUninstaler.exe
WaitForEXE1=IObitUninstaler.exe
WaitForEXE2=PPUninstaller.exe
RunAsAdmin=force
DirectoryMoveOK=yes
SupportsUNC=yes

[Activate]
Registry=true

[FilesMove]
Main.ini=%PAL:DataDir%\Roaming\IObit Uninstaller

[DirectoriesMove]
Roaming=%APPDATA%\IObit
ProgramData=%ALLUSERSAPPDATA%\IObit\IObit Uninstaller
ProductData=%ALLUSERSAPPDATA%\ProductData3
-=%ALLUSERSAPPDATA%\IObit\IObitRtt
-=%LOCALAPPDATA%\IObit

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\IObit
2=%ALLUSERSAPPDATA%\IObit
