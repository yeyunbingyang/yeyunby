[Launch]
ProgramExecutable=RStudio\RStudio32.exe
ProgramExecutable64=RStudio\RStudio64.exe
RunAsAdmin=force 
WaitForEXE1=RStudio32.exe
WaitForEXE2=RStudio64.exe
WaitForEXE2=ruviewer.exe
DirectoryMoveOK=yes 

[Activate]
Registry=true

[RegistryKeys]
R-Studio=HKCU\Software\R-TT\R-Studio
-=HKLM\Software\R-TT\R-Studio

[RegistryValueBackupDelete]
1=HKCU\Software\R-TT\Language

[RegistryCleanupIfEmpty]
1=HKCU\Software\R-TT
2=HKLM\Software\R-TT

[DirectoriesMove]
R-Studio=%APPDATA%\R-TT\R-Studio
Documents=%Documents%\R-TT\R-Studio
RECOVERY=%Documents%\R-TT\RECOVERY

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\R-TT
2=%Documents%\R-TT