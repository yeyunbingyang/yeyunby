[Launch]
ProgramExecutable=WiseImageX\imagex.exe
WorkingDirectory=%PAL:AppDir%\WiseImageX
SinglePortableAppInstance=true
DirectoryMoveOK=yes
SupportsUNC=yes

[Activate]
Registry=true

[RegistryKeys]
-=HKLM\SOFTWARE\WiseCleaner\Wise ImageX

[RegistryCleanupIfEmpty]
1=HKLM\SOFTWARE\WiseCleaner

[DirectoriesMove]
-=%APPDATA%\wisecleaner.com\imagex

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\wisecleaner.com

